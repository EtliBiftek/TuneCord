name: Build TuneCord

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build Electron app
        run: |
          npm ci
          npm run dist
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\app, package\extension, package\tools | Out-Null
          Copy-Item dist\TuneCord.exe package\app\TuneCord.exe
          Copy-Item extension\* package\extension\ -Recurse
          Copy-Item tools\* package\tools\ -Recurse
          Copy-Item README.md, LICENSE, Build.ps1, install.ps1, uninstall.ps1 package\
          Compress-Archive -Path package\* -DestinationPath TuneCord-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TuneCord-Windows-x64
          path: TuneCord-Windows-x64.zip
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          target_commitish: ${{ github.sha }}
          name: TuneCord v1.0.2
          generate_release_notes: true
          files: TuneCord-Windows-x64.zip
