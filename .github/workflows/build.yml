name: Build TuneCord

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify extension sources
        shell: pwsh
        run: |
          if (!(Test-Path "extension/manifest.json")) { throw "Chromium extension source is missing" }
          if (!(Test-Path "extension-firefox/manifest.json")) { throw "Firefox extension source is missing" }

      - name: Patch native helper runtime behavior
        run: python scripts/patch_native_helper_timeout.py

      - name: Verify native bridge patch
        shell: pwsh
        run: |
          if (!(Select-String -Path "native-helper/src/main.rs" -SimpleMatch '("POST","/api/native")')) { throw "Native helper HTTP bridge endpoint is missing" }
          if (!(Select-String -Path "native-host/src/main.rs" -SimpleMatch 'http_post_json("/api/native"')) { throw "Native messaging host is not using the stateless HTTP bridge" }

      - name: Build low-memory native tray backend
        run: cargo build --release --manifest-path native-helper/Cargo.toml

      - name: Build native messaging bridge
        run: cargo build --release --manifest-path native-host/Cargo.toml

      - name: Smoke test native bridge
        run: python scripts/test_native_bridge.py

      - name: Build TuneC icons
        run: |
          python -m pip install --quiet pillow
          python scripts/make_icons.py

      - name: Build Electron settings UI
        run: |
          npm ci
          npm run dist

      - name: Verify packaged extension resources
        shell: pwsh
        run: |
          if (!(Test-Path "dist/win-unpacked/resources/extension/manifest.json")) { throw "Chromium extension was not packaged into resources" }
          if (!(Test-Path "dist/win-unpacked/resources/extension-firefox/manifest.json")) { throw "Firefox extension was not packaged into resources" }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TuneCord.exe
          path: dist/TuneCord.exe

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.7
          target_commitish: ${{ github.sha }}
          name: TuneCord v1.4.7
          generate_release_notes: true
          files: dist/TuneCord.exe
