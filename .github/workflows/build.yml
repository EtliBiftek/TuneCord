name: Build TuneCord

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Build low-memory native tray backend
        run: cargo build --release --manifest-path native-helper/Cargo.toml

      - name: Build native messaging bridge
        run: cargo build --release --manifest-path native-host/Cargo.toml

      - name: Build TuneC icons
        run: |
          python -m pip install --quiet pillow
          python scripts/make_icons.py

      - name: Build Electron settings UI
        run: |
          npm ci
          npm run dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TuneCord.exe
          path: dist/TuneCord.exe

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.4
          target_commitish: ${{ github.sha }}
          name: TuneCord v1.4.4
          generate_release_notes: true
          files: dist/TuneCord.exe
