<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ui.css"><title>TuneCord</title></head>
<body class="popup-body">
  <main class="popup-shell enter">
    <header class="mini-header">
      <div class="mini-brand"><img src="icons/icon48.png" alt=""><div><b>TuneCord</b><span id="bridgeState">Uygulama aranıyor…</span></div></div>
      <button id="settings" class="icon-button" title="Ayarlar">⚙</button>
    </header>

    <section class="now-mini">
      <div class="cover"><img id="trackArt" alt="" hidden><span id="coverFallback">♪</span></div>
      <div class="now-copy"><small>Şu an</small><strong id="trackTitle">Bir şey çalmıyor</strong><span id="trackArtist">YouTube'u açıp bir şarkı başlat.</span></div>
    </section>

    <section class="quick-group">
      <label class="quick-row"><span><b>Discord'da göster</b><small>Presence'i tek tıkla aç veya kapat.</small></span><input id="enabled" type="checkbox"><i class="switch"></i></label>
      <div class="mode-row"><span>Görünürlük</span><div class="segmented"><label><input type="radio" name="mode" value="all"><span>Hepsi</span></label><label><input type="radio" name="mode" value="selected"><span>Playlistler</span></label></div></div>
    </section>

    <button id="retry" class="retry-button">Yeniden bağlan</button>
    <p id="error" class="error" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
