<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TuneCord</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="popup-header">
    <div>
      <span class="eyebrow">TUNECORD</span>
      <h1>Presence</h1>
    </div>
    <span id="bridgeState" class="pill">Uygulama aranıyor…</span>
  </header>

  <main>
    <section class="card now">
      <div class="now-icon">♪</div>
      <div class="now-text">
        <span class="eyebrow">ŞU AN</span>
        <strong id="trackTitle">Bir şey çalmıyor</strong>
        <span id="trackArtist">YouTube'u açıp bir şarkı başlat.</span>
      </div>
    </section>

    <label class="toggle-row standalone">
      <span><b>Discord'da göster</b><small>Rich Presence'i anında aç veya kapat.</small></span>
      <input id="enabled" type="checkbox"><i class="switch"></i>
    </label>

    <section class="card compact">
      <span class="eyebrow">GÖRÜNÜRLÜK</span>
      <div class="segmented vertical">
        <label><input type="radio" name="mode" value="all"><span>Tüm şarkılar</span></label>
        <label><input type="radio" name="mode" value="selected"><span>Seçili playlistler</span></label>
      </div>
    </section>

    <div class="actions">
      <button id="retry" class="secondary">Yeniden bağlan</button>
      <button id="settings" class="primary">Ayarlar</button>
    </div>
    <p id="error" class="error" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
